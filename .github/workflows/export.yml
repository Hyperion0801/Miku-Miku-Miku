name: "Build mikumiku.miku"
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  export:
    name: Build mikumiku.miku
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build
        run: |
          make -j$(nproc)
          rm -fv build/*.o
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 
          path: build/

